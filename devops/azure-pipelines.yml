trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - src/**
      - tests/**
      - Dockerfile
      - devops/**

pr:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - src/**
      - tests/**
      - Dockerfile
      - devops/**

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dockerRegistryServiceConnection: 'myDockerRegistry'
  imageRepository: 'gistapi'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: 'Use .NET SDK 10'
    inputs:
      packageType: sdk
      version: '10.0.x'
      includePreview: true

  - script: |
      dotnet restore src/GistApi/GistApi.csproj
    displayName: Restore dependencies

  - script: |
      dotnet build src/GistApi/GistApi.csproj \
        --configuration $(buildConfiguration) \
        --no-restore
    displayName: Build application

  - script: |
      dotnet test tests/GistApi.Tests/GistApi.Tests.csproj \
        --configuration $(buildConfiguration) \
        --no-build \
        --logger trx
    displayName: Run tests

  - task: Docker@2
    displayName: Login to container registry
    inputs:
      command: login
      containerRegistry: $(dockerRegistryServiceConnection)

  - task: Docker@2
    displayName: Build and push Docker image
    inputs:
      command: buildAndPush
      repository: $(imageRepository)
      dockerfile: $(dockerfilePath)
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        $(tag)
        latest
